<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTAX do Dia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="app-shell">
      <header class="hero">
        <span class="badge">BCB • PTAX</span>
        <h1>Consulta PTAX em tempo real</h1>
        <p>Consulta a API oficial do banco central. Feito com amor para Grazi ❤️</p>
      </header>

      <section class="panel">
        <form id="ptax-form" class="query-form">
          <div class="input-row two-fields">
            <div class="field">
              <label for="date">Data da cotação</label>
              <input id="date" name="date" type="date" required />
            </div>

            <div class="field">
              <label for="brl-value">Valor em reais (R$)</label>
              <input
                id="brl-value"
                name="brlValue"
                type="number"
                min="0.01"
                step="0.01"
                placeholder="Ex.: 120,00"
                required
              />
            </div>

            <button type="submit" id="submit-btn">Calcular PTAX + spread</button>
          </div>
          <small class="helper-text">
            Regra fechada: valor &lt; 90 usa dia anterior + 7%; valor &gt;= 90 usa dia da cotação +
            6%.
          </small>
        </form>

        <section id="result" class="result hidden" aria-live="polite"></section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
