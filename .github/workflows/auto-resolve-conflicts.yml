name: Auto-resolve conflicts PR-WINs

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "conflict-bot"
          git config user.email "conflict-bot@users.noreply.github.com"

      - name: Fetch develop
        run: git fetch origin develop:develop

      - name: Merge develop into branch (keep branch version on conflicts)
        run: |
          git merge develop -X ours --no-edit || true

      - name: Fail if unresolved conflicts remain
        run: |
          if git ls-files -u | grep -q .; then
            echo "Conflitos ainda não resolvidos automaticamente."
            git status
            exit 1
          fi

      - name: Push back
        run: git push origin HEAD
