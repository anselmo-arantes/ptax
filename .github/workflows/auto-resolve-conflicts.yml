name: Auto-resolve conflicts vs develop (PR wins)

on:
  pull_request_target:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "conflict-bot"
          git config user.email "conflict-bot@users.noreply.github.com"

      - name: Fetch develop
        run: git fetch origin develop

      - name: Merge develop into PR (keep PR version on conflicts)
        run: |
          git merge origin/develop -X ours --no-edit || true

      - name: Fail if unresolved conflicts remain
        run: |
          if git ls-files -u | grep -q .; then
            echo "Conflitos ainda não resolvidos automaticamente."
            git status
            exit 1
          fi

      - name: Push back to PR branch
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
